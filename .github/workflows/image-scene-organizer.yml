name: Image Scene Organizer

on:
  pull_request:
    paths:
      - "image-scene-organizer/**"
      - ".github/workflows/image-scene-organizer.yml"
  push:
    branches: [main]
    paths:
      - "image-scene-organizer/**"
      - ".github/workflows/image-scene-organizer.yml"
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Qt ${{ matrix.qpa }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, qpa: windows }    # real Windows platform plugin
          - { os: windows-latest, qpa: offscreen }
          - { os: ubuntu-latest, qpa: offscreen }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: image-scene-organizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: image-scene-organizer/requirements-dev.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -v
        env:
          QT_QPA_PLATFORM: ${{ matrix.qpa }}

  windows-exe:
    name: Windows .exe (build + self-test)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: image-scene-organizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: image-scene-organizer/requirements.txt
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name ImageSceneOrganizer --add-data "scene_organizer/assets:scene_organizer/assets" main.py
      - name: Self-test the built .exe
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest"
          $p = Start-Process -FilePath "dist\ImageSceneOrganizer\ImageSceneOrganizer.exe" `
                 -ArgumentList "--self-test=$out" -Wait -PassThru
          if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" }
          if (Test-Path "$out\crash.txt") { Get-Content "$out\crash.txt" }
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ImageSceneOrganizer-windows
          path: image-scene-organizer/dist/ImageSceneOrganizer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report-windows
          path: image-scene-organizer/selftest
